# dsh-flash-skin bundle layer — registers the HOST half into a profile.
#
# The BROWSER half needs no row here: the module loader auto-discovers the
# client bundle from package.json `exports["./client"]` + `dsh.client` and
# serves it at /plugins/<pkg>/client.js (mirrors dsh-liang-skin).
#
# `id` is the settings namespace for the plugin's config block.
- insert:
    - id: flash-skin
      name: 'dsh-flash-skin'
    # The community-directory target (Feishu app credentials + table ids) is no
    # longer injected here — it's baked in as a code constant
    # (`DEFAULT_COMMUNITY_TARGET` in src/community.js), so the C2 community
    # channels work without any patch row. Set an explicit communityDirectory
    # below ONLY to override the code default.
